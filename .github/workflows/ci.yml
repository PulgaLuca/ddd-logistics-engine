name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  SOLUTION: LogisticsEngine.slnx

jobs:
  build-and-test:
    name: Build, analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Build (warnings as errors, Roslyn analyzers)
        run: dotnet build "$SOLUTION" --no-restore --configuration Release

      - name: Format check
        run: dotnet format "$SOLUTION" --verify-no-changes --no-restore

      # Soglia sul totale di Domain e Application; aumentare a 80 in seguito.
      - name: Unit tests + coverage gate
        run: >
          dotnet test tests/LogisticsEngine.UnitTests
          --no-build --configuration Release
          --logger "trx;LogFileName=unit-tests.trx"
          /p:CollectCoverage=true
          /p:CoverletOutputFormat=cobertura
          /p:CoverletOutput=../../../coverage/
          /p:Threshold=50
          /p:ThresholdType=line
          /p:ThresholdStat=total
          /p:Include="[LogisticsEngine.Domain]*%2c[LogisticsEngine.Application]*"

      - name: Architecture tests
        run: >
          dotnet test tests/LogisticsEngine.ArchitectureTests
          --no-build --configuration Release
          --logger "trx;LogFileName=architecture-tests.trx"

      - name: Integration tests
        run: >
          dotnet test tests/LogisticsEngine.IntegrationTests
          --no-build --configuration Release
          --logger "trx;LogFileName=integration-tests.trx"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore
