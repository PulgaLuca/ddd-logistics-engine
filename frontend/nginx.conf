server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # La SPA usa hash history: il fallback su index.html serve solo a gestire
    # gli accessi diretti a path non esistenti.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # config.runtime.js è generato all'avvio del container: non deve essere
    # messo in cache, altrimenti il browser continuerebbe a puntare al vecchio
    # indirizzo dell'API.
    location = /config.runtime.js {
        add_header Cache-Control "no-store";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
