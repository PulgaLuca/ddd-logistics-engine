<!doctype html>
<html lang="it">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Logistics Engine</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />

  <!-- vis-network: visualizzazione grafi/alberi (nodi = hub, archi = strade) -->
  <script src="https://cdn.jsdelivr.net/npm/vis-network@9.1.9/standalone/umd/vis-network.min.js"></script>

  <!-- Import map: risolve i bare specifier "vue" / "vue-router" senza build step -->
  <script type="importmap">
    {
      "imports": {
        "vue": "https://cdn.jsdelivr.net/npm/vue@3.5.13/dist/vue.esm-browser.prod.js",
        "vue-router": "https://cdn.jsdelivr.net/npm/vue-router@4.5.0/dist/vue-router.esm-browser.prod.js"
      }
    }
  </script>
</head>

<body>
  <div id="app"></div>

  <!-- Configurazione runtime (indirizzo dell'API): in Docker viene rigenerata
       all'avvio del container nginx. Deve precedere il modulo dell'app. -->
  <script src="config.runtime.js"></script>
  <script type="module" src="js/app.js"></script>
</body>

</html>
